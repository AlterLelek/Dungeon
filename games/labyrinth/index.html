<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Лабиринт Судьбы — v8.32</title>
<style>
:root{--gold:#e8b64c;--bg:#141422;--panel:#1e1e2e;--txt:#e8e4d8;--red:#e05555}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 0%,#1e1e30 0%,#101018 70%);color:var(--txt);font-family:system-ui,sans-serif;overflow:hidden;user-select:none;height:100vh}
#app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto;padding:4px 6px;gap:4px}
#topbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--panel);border:1px solid #3a3a52;border-radius:10px;padding:5px 8px;font-size:14px}
.chip{display:flex;align-items:center;gap:4px;white-space:nowrap}
.chip b{color:var(--gold)}
.bar{width:70px;height:10px;background:#111;border:1px solid #444;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .25s}
#hpBar i{background:linear-gradient(90deg,#e04040,#ff7050)}
#manaBar i{background:linear-gradient(90deg,#4060e0,#60a0ff)}
#midbar,#spellbar,#bottombar{display:flex;gap:6px}
#midbar button,#bottombar button{flex:1}
button{background:linear-gradient(#2e2e44,#222236);color:var(--txt);border:1px solid #4a4a68;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;transition:transform .1s}
button:hover{background:#333350;border-color:var(--gold)}
button:active{transform:scale(.95)}
button.sel{border-color:var(--gold);background:#3a3a20;color:var(--gold)}
button.dis{opacity:.4;pointer-events:none}
#stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#cv{background:#0c0c14;border:2px solid #3a3a52;border-radius:10px;touch-action:none}
#dpad{position:absolute;left:6px;bottom:6px;display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:3px;opacity:.75}
#dpad button{padding:0;font-size:18px}
#dpad .up{grid-column:2}
#dpad .left{grid-column:1;grid-row:2}
#dpad .down{grid-column:2;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
.spellBtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;font-size:12px}
.spellBtn small{color:#9a9ab8;font-size:10px}
#spellHint{text-align:center;font-size:12px;color:#b8b8d0;min-height:15px}
.overlay{position:fixed;inset:0;background:rgba(8,8,14,.88);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;padding:10px}
.overlay.show{opacity:1;pointer-events:auto}
.panel{background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:16px;max-width:640px;width:100%;max-height:94vh;overflow:auto}
.panel h2{color:var(--gold);text-align:center;margin-bottom:10px;font-size:22px}
.secTitle{text-align:center;color:var(--gold);font-weight:600;margin:8px 0 6px}
.rowCenter{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.heroCard,.modeChip{cursor:pointer;border:2px solid #4a4a68;border-radius:10px;background:#222236;padding:8px;text-align:center;font-size:12px}
.heroCard{width:96px}
.heroCard .he{font-size:30px;display:block}
.heroCard.sel,.modeChip.sel{border-color:var(--gold);background:#3a2e12}
#nameInp{background:#111;border:1px solid #4a4a68;border-radius:8px;color:var(--txt);padding:8px;width:180px;text-align:center}
#startBtn2{font-size:16px;padding:10px 22px;background:linear-gradient(#4a3a10,#332808);border:1px solid var(--gold);color:var(--gold);font-weight:bold;border-radius:8px;cursor:pointer}
.setLine{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.setLine label{flex:0 0 46%}
.setLine input[type=range]{flex:1;accent-color:var(--gold)}
.setLine .val{flex:0 0 44px;text-align:right;color:var(--gold)}
.setLine select{background:#111;color:var(--txt);border:1px solid #4a4a68;border-radius:6px;padding:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid #33334a;text-align:center}
th{color:var(--gold)}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px}
.statGrid div{background:#222236;border-radius:8px;padding:8px;display:flex;justify-content:space-between}
.btnRow{display:flex;gap:8px;margin-top:12px}
.btnRow button{flex:1}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 120px 40px rgba(200,30,30,.55)}
@media(max-width:560px){
  #topbar{font-size:12px;padding:4px 6px}
  .bar{width:52px}
  button{padding:6px;font-size:12px}
  .heroCard{width:76px}.heroCard .he{font-size:24px}
}
</style>
</head>
<body>
<div id="app">
 <div id="topbar">
   <span class="chip" id="heroChip"></span>
   <span class="chip">❤️<span id="hpTxt"></span><span class="bar" id="hpBar"><i></i></span></span>
   <span class="chip">✨<span class="bar" id="manaBar"><i></i></span></span>
   <span class="chip" id="shieldChip"></span>
   <span class="chip">Очки: <b id="scoreTxt">0</b></span>
   <span class="chip">💎 <span id="gemTxt">0/0</span></span>
   <span class="chip">Уровень: <b id="lvlTxt">1</b></span>
   <span class="chip" id="timeChip"></span>
 </div>
 <div id="midbar">
   <button id="btnPause">⏸ Пауза</button>
   <button id="btnMenu">✖ Меню</button>
   <button id="btnRun">🏃 Бег</button>
 </div>
 <div id="stage">
   <canvas id="cv"></canvas>
   <div id="dpad" style="display:none">
     <button class="up" data-d="0,-1">▲</button>
     <button class="left" data-d="-1,0">◀</button>
     <button class="down" data-d="0,1">▼</button>
     <button class="right" data-d="1,0">▶</button>
   </div>
   <div id="toasts"></div>
 </div>
 <div id="spellbar"></div>
 <div id="spellHint"></div>
 <div id="bottombar">
   <button id="bBtnRec">🏆 Рекорды</button>
   <button id="bBtnStats">📊 Статистика</button>
   <button id="bBtnSet">⚙ Настройки</button>
   <button id="bBtnRules">❓ Условия</button>
 </div>
</div>
<div id="vignette"></div>

<!-- МЕНЮ И ОКНА -->
<div class="overlay" id="menuOv"><div class="panel">
 <h2>ЛАБИРИНТ СУДЬБЫ v8.32</h2>
  <div class="secTitle">⚔ Выбери героя</div><div class="rowCenter" id="heroRow"></div>
 <div class="secTitle">🗺 Выбери режим</div><div class="rowCenter" id="modeRow"></div>
 <div class="rowCenter" style="margin-top:6px"><label><input type="checkbox" id="wallsChk"> Добавить стены</label></div>
 <div class="secTitle">📐 Поле</div><div class="rowCenter" id="fieldRow"></div>
 <div class="rowCenter" style="margin:10px 0"><span>Имя героя:</span><input id="nameInp" maxlength="14" value="Герой"></div>
 <div class="btnRow"><button id="mBtnRec">🏆 Рекорды</button><button id="mBtnStats">📊 Статистика</button><button id="mBtnSet">⚙ Настройки</button><button id="mBtnRules">❓ Условия</button></div>
</div></div>

<div class="overlay" id="pauseOv"><div class="panel" style="max-width:340px;text-align:center">
 <h2>⏸ Пауза</h2>
 <div class="btnRow" style="flex-direction:column"><button id="pResume">▶ Продолжить</button><button id="pRules">❓ Условия</button><button id="pToMenu">✖ В меню</button></div>
</div></div>

<div class="overlay" id="overOv"><div class="panel" style="max-width:380px;text-align:center">
 <h2 id="overTitle">Игра окончена</h2><p id="overMsg" style="margin:8px 0"></p>
 <div class="rowCenter" style="margin:8px 0"><span>Твоё имя:</span><input id="recName" maxlength="14"></div>
 <div class="btnRow"><button id="oSave">💾 В рекорды</button><button id="oAgain">↻ Ещё раз</button><button id="oMenu">✖ В меню</button></div>
</div></div>

<div class="overlay" id="setOv"><div class="panel">
 <h2>⚙ Настройки</h2><div class="rowCenter" id="setTabs" style="gap:4px;margin-bottom:10px"></div>
 <div id="setBody"></div>
 <div class="btnRow"><button id="setReset">↺ Сбросить</button><button id="setDone">✔ Готово</button></div>
</div></div>

<div class="overlay" id="recOv"><div class="panel"><h2>🏆 Таблица рекордов</h2><div id="recBody"></div><div class="btnRow"><button id="recClear">🗑 Очистить</button><button id="recDone">✔ Готово</button></div></div></div>
<div class="overlay" id="statOv"><div class="panel"><h2>📊 Статистика</h2><div class="statGrid" id="statBody"></div><div class="btnRow"><button id="statClear">🗑 Сбросить</button><button id="statDone">✔ Готово</button></div></div></div>
<div class="overlay" id="rulesOv"><div class="panel"><h2>❓ Условия игры</h2><div id="rulesBody" style="font-size:14px;line-height:1.5"></div><div class="btnRow"><button id="rulesDone">✔ Понятно</button></div></div></div>

<script type="module" src="game.js"></script>
</body>
</html>
