<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MM6 — Подземелье</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  #cv { display: block; width: 100%; height: 100%; }
  #hint {
    position: fixed; bottom: 12px; left: 0; width: 100%;
    text-align: center; color: #888; font: 13px sans-serif;
    pointer-events: none;
  }
  #start-screen { position: fixed; inset: 0; z-index: 100; background: radial-gradient(circle at center, rgba(40,34,60,.97) 0%, rgba(8,8,16,.99) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; font-family: sans-serif; overflow-y: auto; padding: 16px; }
  #start-screen h1 { margin: 0; font-size: 26px; letter-spacing: 4px; text-transform: uppercase; color: #fff; text-shadow: 0 0 20px rgba(251,191,36,.6); }
  .mm-instruction { margin: 0; font-size: 13px; line-height: 1.4; text-align: center; max-width: 330px; color: #fbbf24; font-weight: bold; text-transform: uppercase; }
  .carousel-container { display: flex; align-items: center; justify-content: space-between; width: min(320px, 90vw); gap: 4px; }
  .c-arrow { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #fbbf24; font-size: 16px; padding: 8px; border-radius: 50%; cursor: pointer; flex-shrink: 0; }
  .c-arrow:hover { background: rgba(255,255,255,.15); }
  .c-arrow:active { transform: scale(.88); }
  .carousel { display: flex; align-items: center; justify-content: center; gap: 5px; width: 230px; height: 100px; overflow: hidden; }
  .hero-card, .mode-card { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; width: 70px; text-align: center; cursor: pointer; transition: transform .2s, opacity .2s, filter .2s; }
  .hero-card.center, .mode-card.center { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px rgba(251,191,36,.55)); z-index: 2; }
  .hero-card.side, .mode-card.side { transform: scale(.8); opacity: .5; }
  .c-emoji { font-size: 30px; }
  .hero-card.center .c-emoji { font-size: 42px; }
  .c-name, .m-name { font-size: 11px; margin-top: 5px; color: #9ca3af; font-weight: bold; }
  .hero-card.center .c-name, .mode-card.center .m-name { color: #fbbf24; font-size: 12px; }
  .m-icon { font-size: 24px; }
  .mode-card.center .m-icon { font-size: 34px; }
  .desc-text { text-align: center; font-size: 12px; color: #9ca3af; min-height: 32px; max-width: 320px; line-height: 1.35; }
  .name-row { display: flex; gap: 8px; width: min(320px, 90vw); }
  .name-row input { flex: 1; min-width: 0; padding: 10px; border: 2px solid #6b7280; border-radius: 8px; background: #111; color: #fff; font: inherit; outline: none; }
  .name-row input:focus { border-color: #fbbf24; }
  .name-row button { flex: 0 0 auto; padding: 10px 16px; border: 2px solid #fbbf24; border-radius: 8px; background: linear-gradient(135deg,#b45309,#92400e); color: #fff; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">Пробел — ударить · M — меню</div>

<div id="start-screen">
  <h1>ПОДЗЕМЕЛЬЕ <span>6</span></h1>
  <p class="mm-instruction">Выбери активного героя и режим<br>◀ ▶ — герой, ▲ ▼ — режим, Enter — старт</p>
  <div class="carousel-container">
    <button class="c-arrow" id="prev-hero" aria-label="Предыдущий герой">◀</button>
    <div class="carousel" id="hero-carousel"></div>
    <button class="c-arrow" id="next-hero" aria-label="Следующий герой">▶</button>
  </div>
  <p class="desc-text" id="hero-desc"></p>
  <div class="carousel-container">
    <button class="c-arrow" id="prev-mode" aria-label="Предыдущий режим">◀</button>
    <div class="carousel" id="mode-carousel"></div>
    <button class="c-arrow" id="next-mode" aria-label="Следующий режим">▶</button>
  </div>
  <p class="desc-text" id="mode-desc"></p>
  <div class="name-row">
    <input type="text" id="hero-name-input" maxlength="16" value="Герой" placeholder="Имя героя" aria-label="Имя героя">
    <button id="start-btn">▶ Играть</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;

  const HEROES = [
    { id: 'warrior', name: 'ВОИН', emoji: '🛡️', hp: 100, dmg: [8, 22], desc: 'Надёжный боец. Маг остаётся в пати и бьёт рядом.' },
    { id: 'mage', name: 'МАГ', emoji: '🧙', hp: 60, dmg: [14, 32], desc: 'Бьёт сильнее, но хрупкий. Воин остаётся в пати.' }
  ];
  const MODES = [
    { id: 'classic', name: 'Классика', icon: '⚔️', desc: 'Обычный бой. Слизень 68 HP, удар раз в 400 мс.', enemy: 'Слизень', enemyHp: 68, hitDelay: 400 },
    { id: 'fast', name: 'Скорость', icon: '⚡', desc: 'Бей чаще: удар раз в 260 мс, враг послабее.', enemy: 'Слизень-спринтер', enemyHp: 54, hitDelay: 260 },
    { id: 'hard', name: 'Тяжёлый', icon: '🔥', desc: 'Враг выносливее — 110 HP.', enemy: 'Слизень-мутант', enemyHp: 110, hitDelay: 430 }
  ];
  let phase = 'start';
  let heroIdx = 0, modeIdx = 0;
  let activeHero = HEROES[0].id;
  let heroName = 'Герой';

  function resize() {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let t0 = performance.now();
  let lastHit = 0;
  let hitFx = 0;
  let combo = 0;
  let comboTimer = 0;
  let enemies = [
    { name: 'Слизень', hp: 68, maxHp: 68, color: '#2d1b4e', eyes: '#ff0000', yOff: 0 },
  ];

  // Факелы мигают
  let flamePhase = Math.random() * 6.28;

  // ===== ВВОД =====
  document.addEventListener('keydown', e => {
    if (phase === 'start') {
      if (e.target && e.target.id === 'hero-name-input') return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); selectHero(heroIdx - 1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); selectHero(heroIdx + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); selectMode(modeIdx - 1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); selectMode(modeIdx + 1); }
      else if (e.key === 'Enter') { e.preventDefault(); startGame(); }
      return;
    }
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      tryHit();
    }
    if (e.key.toLowerCase() === 'm' || e.key === 'ь') {
      location.href = '../../index.html';
    }
  });
  cv.addEventListener('pointerdown', tryHit);

  function tryHit() {
    if (phase !== 'play') return;
    const now = performance.now();
    if (now - lastHit < MODES[modeIdx].hitDelay) return;
    lastHit = now;
    hitFx = 1;
    combo = (now - comboTimer < 2000) ? combo + 1 : 1;
    comboTimer = now;

    // Урон первому живому
    const alive = enemies.find(en => en.hp > 0);
    if (alive) {
      const h = HEROES[heroIdx];
      const dmg = h.dmg[0] + Math.floor(Math.random() * (h.dmg[1] - h.dmg[0] + 1));
      alive.hp = Math.max(0, alive.hp - dmg);
      alive.lastDmg = dmg;
      alive.dmgT = 1;
    }
  }

  function renderHeroCarousel() {
    const box = document.getElementById('hero-carousel');
    box.innerHTML = '';
    const total = HEROES.length;
    for (let off = -1; off <= 1; off++) {
      const idx = (heroIdx + off + total) % total;
      const h = HEROES[idx];
      const card = document.createElement('div');
      card.className = 'hero-card ' + (off === 0 ? 'center' : 'side');
      card.innerHTML = '<div class="c-emoji">' + h.emoji + '</div><div class="c-name">' + h.name + '</div>';
      if (off !== 0) card.onclick = () => selectHero(idx);
      box.appendChild(card);
    }
    document.getElementById('hero-desc').textContent = HEROES[heroIdx].name + ': ' + HEROES[heroIdx].desc;
  }

  function renderModeCarousel() {
    const box = document.getElementById('mode-carousel');
    box.innerHTML = '';
    const total = MODES.length;
    for (let off = -1; off <= 1; off++) {
      const idx = (modeIdx + off + total) % total;
      const m = MODES[idx];
      const card = document.createElement('div');
      card.className = 'mode-card ' + (off === 0 ? 'center' : 'side');
      card.innerHTML = '<span class="m-icon">' + m.icon + '</span><span class="m-name">' + m.name + '</span>';
      if (off !== 0) card.onclick = () => selectMode(idx);
      box.appendChild(card);
    }
    document.getElementById('mode-desc').textContent = MODES[modeIdx].desc;
  }

  function selectHero(idx) {
    heroIdx = (idx + HEROES.length) % HEROES.length;
    renderHeroCarousel();
  }

  function selectMode(idx) {
    modeIdx = (idx + MODES.length) % MODES.length;
    renderModeCarousel();
  }

  function startGame() {
    const typed = document.getElementById('hero-name-input').value.trim();
    if (typed) heroName = typed.slice(0, 16);
    activeHero = HEROES[heroIdx].id;
    const m = MODES[modeIdx];
    enemies = [{ name: m.enemy, hp: m.enemyHp, maxHp: m.enemyHp, color: '#2d1b4e', eyes: '#ff0000', yOff: 0 }];
    lastHit = 0; hitFx = 0; combo = 0; comboTimer = 0;
    phase = 'play';
    document.getElementById('start-screen').style.display = 'none';
  }

  document.getElementById('prev-hero').onclick = () => selectHero(heroIdx - 1);
  document.getElementById('next-hero').onclick = () => selectHero(heroIdx + 1);
  document.getElementById('prev-mode').onclick = () => selectMode(modeIdx - 1);
  document.getElementById('next-mode').onclick = () => selectMode(modeIdx + 1);
  document.getElementById('start-btn').onclick = startGame;
  document.getElementById('hero-name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); startGame(); }
  });
  renderHeroCarousel();
  renderModeCarousel();

  // ===== РЕНДЕР =====
  function draw(now) {
    requestAnimationFrame(draw);
    const t = now - t0;
    const cx = W / 2;
    const cy = H / 2;

    // Очистка
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, W, H);

    // ===== КОРИДОР =====
    // Дальняя стена
    const farY = cy - 80;
    const farW = 160;
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(cx - farW/2, farY - 60, farW, 120);

    // Линии схода (потолок, пол, стены)
    ctx.strokeStyle = 'rgba(100, 100, 150, 0.35)';
    ctx.lineWidth = 2;

    // Пол — горизонтальные плиты
    for (let i = 1; i <= 6; i++) {
      const p = Math.pow(i / 6, 1.6);
      const y = cy + 60 + p * (H - cy - 60);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    // Вертикальные линии схода
    for (let i = -4; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * (W / 6), H);
      ctx.lineTo(cx + i * 28, farY + 60);
      ctx.stroke();
    }

    // Потолок
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * (W / 4), 0);
      ctx.lineTo(cx + i * 20, farY - 60);
      ctx.stroke();
    }

    // ===== ФАКТЕЛЫ =====
    drawTorch(cx - W * 0.35, cy - 40, t, flamePhase);
    drawTorch(cx + W * 0.35, cy - 40, t, flamePhase + 1.3);

    // ===== ВРАГ =====
    drawEnemies(t, cx, cy);

    // ===== ГЕРОИ: активный выделен, второй остаётся в пати =====
    const wy = cy + H * 0.18;
    const wx = cx - W * 0.22, mx = cx + W * 0.22;
    drawHeroRing(wx, wy, activeHero === 'warrior', '#f4d03f');
    drawHeroRing(mx, wy, activeHero === 'mage', '#a78bfa');
    ctx.save(); ctx.globalAlpha = activeHero === 'mage' ? 0.65 : 1;
    drawWarrior(wx, wy, t, hitFx);
    ctx.restore();
    ctx.save(); ctx.globalAlpha = activeHero === 'warrior' ? 0.65 : 1;
    drawMage(mx, wy, t);
    ctx.restore();

    // ===== ЭФФЕКТ УДАРА =====
    if (hitFx > 0) {
      ctx.save();
      ctx.globalAlpha = hitFx * 0.6;
      const grad = ctx.createRadialGradient(cx, cy - 20, 10, cx, cy - 20, 120);
      grad.addColorStop(0, 'rgba(255,255,200,0.9)');
      grad.addColorStop(1, 'rgba(255,200,50,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy - 20, 120, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      hitFx = Math.max(0, hitFx - 0.06);
    }

    // ===== КОМБО и УРОН =====
    if (combo >= 2) {
      ctx.save();
      const pulse = 1 + 0.05 * Math.sin(now / 80);
      ctx.translate(cx, cy - 100);
      ctx.scale(pulse, pulse);
      ctx.font = 'bold 42px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 6;
      ctx.strokeText('⚔️ КОМБО x' + combo + '!', 0, 0);
      ctx.fillStyle = '#e8b64c';
      ctx.fillText('⚔️ КОМБО x' + combo + '!', 0, 0);
      ctx.restore();
    }

    // Урон на враге
    const alive = enemies.find(en => en.hp > 0);
    if (alive && alive.dmgT > 0) {
      ctx.save();
      ctx.globalAlpha = alive.dmgT;
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 5;
      const y = cy - 50 - (1 - alive.dmgT) * 40;
      ctx.strokeText('-' + alive.lastDmg, cx, y);
      ctx.fillStyle = '#ff5555';
      ctx.fillText('-' + alive.lastDmg, cx, y);
      ctx.restore();
      alive.dmgT = Math.max(0, alive.dmgT - 0.02);
    }

    // ===== HUD СНИЗУ =====
    drawBottomHud(cx, cy, H);

    // ===== ИМЕНА =====
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#7cc3ff';
    ctx.fillText('ВОИН', cx - W * 0.22, cy + H * 0.18 + 140);
    ctx.fillStyle = '#c084ff';
    ctx.fillText('МАГ', cx + W * 0.22, cy + H * 0.18 + 140);
  }

  function drawTorch(x, y, t, phase) {
    const flicker = 0.85 + 0.15 * Math.sin(t / 100 + phase) + 0.1 * Math.sin(t / 37 + phase * 2);
    const r = 70 * flicker;

    // Свечение
    const grad = ctx.createRadialGradient(x, y, 4, x, y, r);
    grad.addColorStop(0, 'rgba(255,200,80,0.75)');
    grad.addColorStop(0.5, 'rgba(255,140,40,0.3)');
    grad.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // Держатель
    ctx.fillStyle = '#3a2410';
    ctx.fillRect(x - 3, y + 6, 6, 20);

    // Огонь
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.moveTo(x, y - 22 * flicker);
    ctx.quadraticCurveTo(x + 12, y - 4, x, y + 8);
    ctx.quadraticCurveTo(x - 12, y - 4, x, y - 22 * flicker);
    ctx.fill();

    ctx.fillStyle = '#ffcc00';
    ctx.beginPath();
    ctx.moveTo(x, y - 12 * flicker);
    ctx.quadraticCurveTo(x + 6, y - 2, x, y + 5);
    ctx.quadraticCurveTo(x - 6, y - 2, x, y - 12 * flicker);
    ctx.fill();
  }

  function drawEnemies(t, cx, cy) {
    const alive = enemies.find(en => en.hp > 0);
    if (!alive) {
      // Все мертвы — пишем
      ctx.fillStyle = '#e8b64c';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ПОБЕДА!', cx, cy - 40);
      return;
    }

    const bob = Math.sin(t / 400) * 4;
    const ey = cy - 20 + bob;

    // Тень
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(cx, ey + 60, 55, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    // Тело (неровная тёмная масса)
    ctx.fillStyle = '#2d1b4e';
    ctx.beginPath();
    ctx.moveTo(cx - 48, ey + 50);
    ctx.quadraticCurveTo(cx - 60, ey - 20, cx - 25, ey - 50);
    ctx.quadraticCurveTo(cx, ey - 60, cx + 25, ey - 50);
    ctx.quadraticCurveTo(cx + 60, ey - 20, cx + 48, ey + 50);
    ctx.closePath();
    ctx.fill();

    // Фиолетовые прожилки
    ctx.strokeStyle = '#6b3fa0';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const yy = ey + 10 + i * 12;
      ctx.beginPath();
      ctx.moveTo(cx - 35, yy);
      ctx.quadraticCurveTo(cx, yy - 5, cx + 35, yy + 2);
      ctx.stroke();
    }

    // Рога
    ctx.fillStyle = '#2d1b4e';
    ctx.beginPath();
    ctx.moveTo(cx - 25, ey - 45);
    ctx.lineTo(cx - 40, ey - 80);
    ctx.lineTo(cx - 10, ey - 55);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 25, ey - 45);
    ctx.lineTo(cx + 40, ey - 80);
    ctx.lineTo(cx + 10, ey - 55);
    ctx.closePath();
    ctx.fill();

    // Глаза
    const eyeGlow = 0.8 + 0.2 * Math.sin(t / 200);
    ctx.fillStyle = '#ff0000';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 10 * eyeGlow;
    ctx.beginPath();
    ctx.arc(cx - 14, ey - 20, 6, 0, Math.PI * 2);
    ctx.arc(cx + 14, ey - 20, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Зрачки
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx - 14, ey - 20, 2, 0, Math.PI * 2);
    ctx.arc(cx + 14, ey - 20, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHeroRing(x, y, active, color) {
    ctx.save();
    ctx.globalAlpha = active ? 0.85 : 0.2;
    ctx.strokeStyle = color;
    ctx.lineWidth = active ? 3 : 1;
    ctx.beginPath();
    ctx.ellipse(x, y + 100, active ? 48 : 40, active ? 13 : 10, 0, 0, Math.PI * 2);
    ctx.stroke();
    if (active) {
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = color;
      ctx.fill();
    }
    ctx.restore();
  }

  function drawWarrior(x, y, t, fx) {
    const bob = Math.sin(t / 500) * 2;
    const lunge = fx > 0 ? -fx * 20 : 0;

    ctx.save();
    ctx.translate(x + lunge, y + bob);

    // Тень
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 100, 40, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Тело (синий плащ)
    ctx.fillStyle = '#4a90e2';
    ctx.beginPath();
    ctx.moveTo(-30, 100);
    ctx.lineTo(30, 100);
    ctx.lineTo(18, -10);
    ctx.lineTo(-18, -10);
    ctx.closePath();
    ctx.fill();

    // Руки
    ctx.fillStyle = '#4a90e2';
    ctx.fillRect(-38, 0, 14, 60);
    ctx.fillRect(24, 0, 14, 60);

    // Голова
    ctx.fillStyle = '#f5cba7';
    ctx.beginPath();
    ctx.arc(0, -28, 18, 0, Math.PI * 2);
    ctx.fill();

    // Волосы
    ctx.fillStyle = '#8b4513';
    ctx.beginPath();
    ctx.arc(0, -36, 19, Math.PI, 0);
    ctx.fill();

    // Глаза
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-6, -30, 3, 4);
    ctx.fillRect(3, -30, 3, 4);

    // Меч
    ctx.save();
    ctx.rotate(-0.3 - fx * 0.5);
    ctx.strokeStyle = '#dddddd';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(30, 20);
    ctx.lineTo(80, -40);
    ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(30, 20);
    ctx.lineTo(80, -40);
    ctx.stroke();
    // Рукоять
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(24, 14, 10, 14);
    ctx.restore();

    ctx.restore();
  }

  function drawMage(x, y, t) {
    const bob = Math.sin(t / 600 + 1.5) * 2;

    ctx.save();
    ctx.translate(x, y + bob);

    // Тень
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 100, 40, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Тело (фиолетовая мантия)
    ctx.fillStyle = '#8e44ad';
    ctx.beginPath();
    ctx.moveTo(-30, 100);
    ctx.lineTo(30, 100);
    ctx.lineTo(18, -10);
    ctx.lineTo(-18, -10);
    ctx.closePath();
    ctx.fill();

    // Капюшон
    ctx.fillStyle = '#6c2d8c';
    ctx.beginPath();
    ctx.arc(0, -25, 22, 0, Math.PI * 2);
    ctx.fill();

    // Лицо (в тени капюшона)
    ctx.fillStyle = '#f5cba7';
    ctx.beginPath();
    ctx.arc(0, -25, 14, 0, Math.PI * 2);
    ctx.fill();

    // Глаза
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-6, -27, 3, 4);
    ctx.fillRect(3, -27, 3, 4);

    // Борода
    ctx.fillStyle = '#dddddd';
    ctx.beginPath();
    ctx.moveTo(-10, -14);
    ctx.lineTo(10, -14);
    ctx.lineTo(0, 10);
    ctx.closePath();
    ctx.fill();

    // Посох
    ctx.strokeStyle = '#8b4513';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(30, 100);
    ctx.lineTo(30, -50);
    ctx.stroke();

    // Шар на посохе
    const glow = 0.7 + 0.3 * Math.sin(t / 200);
    const grad = ctx.createRadialGradient(30, -55, 2, 30, -55, 20);
    grad.addColorStop(0, 'rgba(200,255,255,' + glow + ')');
    grad.addColorStop(0.5, 'rgba(0,200,255,' + (glow * 0.7) + ')');
    grad.addColorStop(1, 'rgba(0,100,200,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(30, -55, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#88eeff';
    ctx.beginPath();
    ctx.arc(30, -55, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBottomHud(cx, cy, H) {
    // HP воина
    const hpY = H - 80;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(20, hpY, 200, 40);
    ctx.strokeStyle = '#d4a017';
    ctx.lineWidth = 2;
    ctx.strokeRect(20, hpY, 200, 40);

    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#f4d03f';
    ctx.fillText((activeHero === 'warrior' ? '▶ ' : '') + (activeHero === 'warrior' ? heroName : HEROES[0].name), 30, hpY + 6);
    ctx.fillStyle = '#fff';
    ctx.fillText('❤️ 85/100', 30, hpY + 22);

    // MP мага
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W - 220, hpY, 200, 40);
    ctx.strokeStyle = '#d4a017';
    ctx.strokeRect(W - 220, hpY, 200, 40);

    ctx.fillStyle = '#f4d03f';
    ctx.fillText((activeHero === 'mage' ? '▶ ' : '') + (activeHero === 'mage' ? heroName : HEROES[1].name), W - 210, hpY + 6);
    ctx.fillStyle = '#fff';
    ctx.fillText('❤️ 60/60', W - 210, hpY + 22);

    // HP врага сверху
    const alive = enemies.find(en => en.hp > 0);
    if (alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(cx - 120, 20, 240, 40);
      ctx.strokeStyle = '#d4a017';
      ctx.strokeRect(cx - 120, 20, 240, 40);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#f4d03f';
      ctx.fillText(alive.name, cx, 26);

      // Полоска
      ctx.fillStyle = '#3a0a0a';
      ctx.fillRect(cx - 100, 44, 200, 8);
      ctx.fillStyle = '#ff3333';
      ctx.fillRect(cx - 100, 44, 200 * (alive.hp / alive.maxHp), 8);

      ctx.fillStyle = '#fff';
      ctx.textAlign = 'right';
      ctx.fillText(alive.hp + '/' + alive.maxHp, cx + 105, 26);
    }
  }

  t0 = performance.now();
  requestAnimationFrame(draw);
})();
</script>
</body>
