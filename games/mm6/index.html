<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Подземелье 6</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#05060d; color:#f3e8cf; font-family:"Segoe UI",Tahoma,sans-serif; }
  #cv { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#0a0d1c; box-shadow:0 0 70px rgba(0,0,0,.9); }

  #start { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; overflow-y:auto;
    background:radial-gradient(circle at 50% 10%,#2b2450 0%,#12142c 42%,#070810 100%); }
  #start.hidden { display:none; }
  .panel { width:min(620px,94vw); margin:16px auto; padding:18px 20px 22px; border:1px solid rgba(251,191,36,.38); border-radius:16px;
    background:linear-gradient(160deg,rgba(20,22,44,.97),rgba(8,10,22,.98)); box-shadow:0 0 50px rgba(0,0,0,.75),inset 0 0 35px rgba(251,191,36,.05); }
  .head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  h1 { margin:0; font-size:26px; letter-spacing:3px; color:#ffdc7a; text-shadow:0 0 18px rgba(251,191,36,.55); }
  h1 span { color:#fff3c4; border:1px solid rgba(251,191,36,.6); border-radius:6px; padding:0 6px; font-size:20px; }
  .linkbtn { background:transparent; border:1px solid rgba(255,255,255,.18); color:#b9bfd6; border-radius:8px; padding:6px 10px; cursor:pointer; font-size:11px; }
  .linkbtn:hover { border-color:#fbbf24; color:#ffe9b0; }
  .progress { display:flex; align-items:center; gap:12px; margin:14px 0 12px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.07); }
  .progress svg { width:52px; height:52px; flex:0 0 52px; transform:rotate(-90deg); }
  .progress circle { fill:none; stroke-width:4; }
  .ringTrack { stroke:rgba(255,255,255,.10); }
  #ring { stroke:#fbbf24; stroke-linecap:round; transition:stroke-dashoffset .5s ease,stroke .5s ease; filter:drop-shadow(0 0 4px rgba(251,191,36,.85)); }
  body.achieved #ring { stroke:#7dffb2; filter:drop-shadow(0 0 7px rgba(125,255,178,.95)); }
  .progress b { display:block; color:#ffe6a8; font-size:13px; }
  .progress small { display:block; color:#a8afc8; font-size:11px; line-height:1.45; margin-top:2px; }
  #winCounts { color:#fbbf24; font-weight:600; font-size:11px; margin-top:3px; }
  h3 { margin:12px 0 6px; color:#9fb0d8; font-size:11px; letter-spacing:2px; text-transform:uppercase; }
  .carousel { display:flex; align-items:center; gap:8px; }
  .arrow { width:36px; height:46px; flex:0 0 36px; border-radius:9px; border:1px solid rgba(255,255,255,.16); color:#d7dcf0; background:rgba(255,255,255,.05); cursor:pointer; font-size:16px; }
  .arrow:hover { border-color:#fbbf24; color:#ffe9b0; }
  .cards { flex:1; height:112px; display:flex; align-items:center; justify-content:center; gap:22px; overflow:hidden; }
  .card { position:relative; width:128px; height:106px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; opacity:.55; transition:opacity .2s ease,transform .2s ease; }
  .card.sel { opacity:1; transform:scale(1.05); cursor:default; }
  .ring { position:absolute; left:50%; top:4px; width:82px; height:82px; margin-left:-41px; border:3px solid rgba(255,255,255,.20); border-radius:50%; transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease; }
  .card.sel .ring { border-color:#ffd35e; box-shadow:0 0 14px rgba(255,211,94,.9),inset 0 0 12px rgba(255,211,94,.35); transform:scale(1.04); }
  .card img { position:relative; width:70px; height:70px; object-fit:contain; filter:drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
  .cname { position:relative; margin-top:4px; font-size:11px; font-weight:700; color:#f4e7c6; }
  .card.sel .cname { color:#ffe9b0; }
  .desc { min-height:30px; margin:4px 0 0; text-align:center; font-size:11px; color:#aab4d0; line-height:1.45; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row input { flex:1; min-width:0; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.18); border-radius:9px; padding:10px 12px; color:#fff3d0; outline:none; }
  .row input:focus { border-color:#fbbf24; }
  #playBtn { padding:10px 18px; border:0; border-radius:9px; cursor:pointer; font-weight:800; color:#241704; background:linear-gradient(180deg,#ffe9a8,#f5b92c); box-shadow:0 4px 0 #8a5b0c,0 0 20px rgba(251,191,36,.35); }
  #playBtn:active { transform:translateY(2px); box-shadow:0 2px 0 #8a5b0c; }
  .hint { margin-top:10px; text-align:center; color:#6f7898; font-size:10px; line-height:1.5; }

  #turnPad, #buildPad { position:fixed; bottom:12px; z-index:10; display:none; gap:8px; }
  #turnPad { left:50%; transform:translateX(-50%); }
  #buildPad { left:12px; }
  #turnPad.show, #buildPad.show { display:flex; }
  #turnPad button, #buildPad button { height:46px; padding:0 12px; border-radius:10px; border:1px solid rgba(251,191,36,.45); color:#ffe9b0; background:rgba(12,14,28,.86); cursor:pointer; font-size:11px; font-weight:700; white-space:nowrap; }
  #turnPad button:active, #buildPad button:active { transform:translateY(2px); }
  #fleeBtn { position:fixed; right:12px; bottom:12px; z-index:12; display:none; padding:10px 14px; border-radius:10px; border:1px solid rgba(248,113,113,.6); color:#ffd5d5; background:rgba(58,12,20,.92); cursor:pointer; font-size:12px; font-weight:800; }
  #fleeBtn.show { display:block; }
  #fleeBtn:active { transform:translateY(2px); }

  #shop { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; background:rgba(3,4,10,.82); }
  #shop.show { display:flex; }
  .shopPanel { width:min(640px,94vw); max-height:86vh; overflow:auto; padding:18px; border:1px solid rgba(251,191,36,.5); border-radius:14px; background:linear-gradient(160deg,#171a34,#080a18); box-shadow:0 0 50px rgba(0,0,0,.8); }
  .shopHead { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .shopHead h2 { margin:0; font-size:17px; color:#ffe09a; }
  .shopSec { margin:10px 0 4px; color:#9fb0d8; font-size:10px; letter-spacing:2px; text-transform:uppercase; }
  .shopItem { display:flex; align-items:center; gap:8px; padding:7px 9px; margin:4px 0; border:1px solid rgba(255,255,255,.10); border-radius:9px; background:rgba(255,255,255,.035); }
  .shopItem img { width:32px; height:32px; object-fit:contain; }
  .shopItem div { flex:1; font-size:12px; }
  .shopItem small { display:block; color:#9aa4c2; font-size:10px; }
  .shopItem button { border:0; border-radius:7px; padding:7px 9px; cursor:pointer; background:#fbbf24; color:#241704; font-weight:800; font-size:10px; }
  .shopItem button.sell { background:#4b6b8a; color:#eaf4ff; }
  .shopItem button.use { background:#547a4a; color:#efffe9; }
  .shopItem button:disabled { background:#3a3d52; color:#838aa4; cursor:default; }
  .shopFoot { margin-top:10px; text-align:right; font-size:11px; color:#fbbf24; }

  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(20px); z-index:60; pointer-events:none; padding:10px 18px; border-radius:20px; background:rgba(12,14,28,.94); border:1px solid rgba(251,191,36,.6); color:#ffe9b0; font-size:12px; font-weight:700; opacity:0; transition:opacity .25s,transform .25s; white-space:nowrap; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<canvas id="cv" width="640" height="360" aria-label="Игра Подземелье 6"></canvas>

<div id="start">
  <div class="panel">
    <div class="head">
      <h1>ПОДЗЕМЕЛЬЕ <span>6</span></h1>
      <button class="linkbtn" id="homeBtn">Главное меню</button>
    </div>
    <div class="progress">
      <svg viewBox="0 0 42 42" aria-hidden="true">
        <circle class="ringTrack" cx="21" cy="21" r="17"></circle><circle id="ring" cx="21" cy="21" r="17"></circle>
      </svg>
      <div>
        <b id="achTitle">ДОСТИЖЕНИЕ · КРУГ СЛАВЫ</b>
        <small id="achText">5 побед в «Карте» и 5 побед в «Быстрой схватке»</small>
        <div id="winCounts">Карта 0/5 · Схватка 0/5</div>
      </div>
    </div>
    <h3>Герой</h3>
    <div class="carousel">
      <button class="arrow" id="heroPrev" aria-label="Предыдущий герой">◀</button>
      <div class="cards" id="heroCarousel"></div>
      <button class="arrow" id="heroNext" aria-label="Следующий герой">▶</button>
    </div>
    <p class="desc" id="heroDesc"></p>
    <h3>Режим</h3>
    <div class="carousel">
      <button class="arrow" id="modePrev" aria-label="Предыдущий режим">◀</button>
      <div class="cards" id="modeCarousel"></div>
      <button class="arrow" id="modeNext" aria-label="Следующий режим">▶</button>
    </div>
    <p class="desc" id="modeDesc"></p>
    <div class="row">
      <input id="heroName" type="text" maxlength="14" value="Герой" placeholder="Имя героя" aria-label="Имя героя">
      <button id="playBtn">▶ Играть</button>
    </div>
    <div class="hint">◀ ▶ — герой · ▲ ▼ — режим · Enter — старт<br>WASD/стрелки — движение · Q/E (й/у) — поворот · Enter — вход в здание · B — лавка · M — меню</div>
  </div>
</div>

<div id="turnPad">
  <button id="turnLeft" aria-label="Поворот влево">⟲ Повернуть влево</button>
  <button id="turnRight" aria-label="Поворот вправо">⟳ Повернуть вправо</button>
</div>
<div id="buildPad">
  <button id="buildShop" aria-label="Открыть лавку">🛒 Лавка [Enter]</button>
  <button id="buildExit" aria-label="Выйти из здания">🚪 Выйти из здания</button>
</div>
<button id="fleeBtn" aria-label="Побег из боя">🏃 Бегство [R]</button>

<div id="shop">
  <div class="shopPanel">
    <div class="shopHead"><h2 id="shopTitle">🛒 Лавка</h2><button class="linkbtn" id="shopClose">Закрыть [B]</button></div>
    <div id="shopList"></div>
    <div class="shopFoot">Золото: <b id="shopGold">0</b> · Кристаллы: <b id="shopCrystals">0</b></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16);
  window.cancelAnimationFrame = id => clearTimeout(id);

  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const W = 640, H = 360, ASSET = '../dungeon28/assets/sprites/';
  const startScreen = document.getElementById('start'), shop = document.getElementById('shop'), toastEl = document.getElementById('toast');
  const turnPad = document.getElementById('turnPad'), buildPad = document.getElementById('buildPad'), fleeBtn = document.getElementById('fleeBtn');
  let toastTimer = 0;
  function updatePads(){
    const active=!!game, inBattle=!!(game&&game.battle&&!game.battle.end), inMap=!!(game&&game.mode==='map'), inShop=!!(game&&game.shopOpen);
    turnPad.classList.toggle('show',active&&inMap&&!inBattle&&!inShop);
    buildPad.classList.toggle('show',active&&inMap&&!!game.interior&&!inBattle&&!inShop);
    fleeBtn.classList.toggle('show',active&&inBattle);
  }

  function fit(){
    const s = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = Math.max(1,Math.floor(W*s)) + 'px';
    cv.style.height = Math.max(1,Math.floor(H*s)) + 'px';
  }
  addEventListener('resize', fit); fit();

  function toast(text){
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  /* База Подземелья 28: герои, монстры, оружие и цены покупки не меняются. */
  const HEROES = [
    { name:'Воин', set:'warrior', hp:100, mp:3, atk:1, def:0, sprite:ASSET+'heroes/knight_0.png',
      desc:'Крепкий боец из Подземелья 28. Держит строй и бьёт наверняка.',
      weapons:[
        {name:'Кулаки',dmg:1,cost:0,sprite:ASSET+'items/sword_0.png'},
        {name:'Кинжал',dmg:2,cost:1,sprite:ASSET+'items/sword_1.png'},
        {name:'Меч',dmg:3,cost:2,sprite:ASSET+'items/sword_2.png'},
        {name:'Топор',dmg:4,cost:3,sprite:ASSET+'items/axe_0.png'},
        {name:'Молот',dmg:5,cost:4,sprite:ASSET+'items/axe_1.png'},
        {name:'Кинжал+',dmg:6,cost:5},{name:'Меч+',dmg:7,cost:6},{name:'Топор+',dmg:8,cost:7},{name:'Молот+',dmg:9,cost:8},
        {name:'Кинжал++',dmg:10,cost:9},{name:'Меч++',dmg:11,cost:10},{name:'Топор++',dmg:12,cost:11},{name:'Молот++',dmg:13,cost:12},
        {name:'Кинжал★',dmg:14,cost:13},{name:'Меч★',dmg:15,cost:14},{name:'Топор★',dmg:16,cost:15},{name:'Молот★',dmg:17,cost:16}
      ]},
    { name:'Маг', set:'mage', hp:80, mp:5, atk:1, def:0, sprite:ASSET+'heroes/wizard_0.png',
      desc:'Хрупкий, но дальнобойный. Заряд маны бьёт сильнее.',
      weapons:[
        {name:'Кулаки',dmg:1,cost:0},{name:'Кольцо',dmg:2,cost:1},
        {name:'Палочка',dmg:3,cost:2,sprite:ASSET+'items/staff_0.png'},
        {name:'Амулет',dmg:4,cost:3},{name:'Книга',dmg:5,cost:4},
        {name:'Кольцо+',dmg:6,cost:5},{name:'Палочка+',dmg:7,cost:6},{name:'Амулет+',dmg:8,cost:7},{name:'Книга+',dmg:9,cost:8},
        {name:'Кольцо++',dmg:10,cost:9},{name:'Палочка++',dmg:11,cost:10},{name:'Амулет++',dmg:12,cost:11},{name:'Книга++',dmg:13,cost:12},
        {name:'Кольцо★',dmg:14,cost:13},{name:'Палочка★',dmg:15,cost:14},{name:'Амулет★',dmg:16,cost:15},{name:'Книга★',dmg:17,cost:16}
      ]}
  ];

  const MONSTERS = [
    {name:'Скелет', hp:100, atk:5, def:0, sprite:ASSET+'monsters/skeleton_0.png'},
    {name:'Призрак', hp:75, atk:4, def:0, sprite:ASSET+'monsters/ghost_0.png'},
    {name:'Мышь', hp:50, atk:3, def:0, sprite:ASSET+'monsters/rat_0.png'},
    {name:'Паук', hp:60, atk:4, def:0, sprite:ASSET+'monsters/spider_0.png'},
    {name:'Огр', hp:130, atk:6, def:1, sprite:ASSET+'monsters/orge_0.png'},
    {name:'Зомби', hp:150, atk:6, def:1, sprite:ASSET+'monsters/undead_0.png', poison:true},
    {name:'Черепаха', hp:200, atk:3, def:8, sprite:ASSET+'monsters/turtle_0.png'},
    {name:'Черт', hp:85, atk:7, def:2, sprite:ASSET+'monsters/demon_0.png'},
    {name:'Некромант', hp:90, atk:5, def:2, sprite:ASSET+'monsters/necromancer_0.png'},
    {name:'Тёмный арбалетчик', hp:85, atk:8, def:1, sprite:ASSET+'monsters/dark_archer_0.png'}
  ];

  const MODES = [
    {id:'map', name:'Карта', icon:'🗺', desc:'Три региона 10×10: враги, здания, бонусы и лавки. Победи всех врагов всех регионов.'},
    {id:'skirmish', name:'Быстрая схватка', icon:'⚔', desc:'Короткий пошаговый бой с видом из-за спины: чужак слева, герой справа.'}
  ];

  /* Новые товары. Цены покупки оружия остаются из d28; цены продажи новых вещей можно подгонять свободно. */
  const GOODS = [
    {id:'leather', name:'Кожаная броня', kind:'armor', armor:1, buy:4, sell:3, desc:'Защита +1'},
    {id:'iron', name:'Железная броня', kind:'armor', armor:2, buy:8, sell:6, desc:'Защита +2'},
    {id:'potion', name:'Зелье здоровья', kind:'item', heal:25, buy:5, sell:4, desc:'Лечит 25 HP'},
    {id:'charm', name:'Оберег маны', kind:'item', mp:3, buy:6, sell:5, desc:'Восстанавливает 3 MP'},
    {id:'crystal', name:'Кристалл', kind:'item', crystal:1, buy:7, sell:6, desc:'Редкий товар'},
    {id:'coin', name:'Древняя монета', kind:'item', gold:3, buy:0, sell:3, desc:'Находка на карте'}
  ];
  const BUILDINGS = {
    smith:{title:'Оружейная', accent:'#d9a441'},
    market:{title:'Рынок', accent:'#7ec8a1'},
    alchemy:{title:'Алхимическая лавка', accent:'#a58cff'}
  };
  const PICKUPS = {
    coin:{icon:'🪙', color:'#ffd76a', label:'монеты'},
    mana:{icon:'💧', color:'#7dd3fc', label:'ману'},
    crystal:{icon:'🔷', color:'#a5b4fc', label:'кристалл'},
    armor:{icon:'🛡', color:'#bde0b5', label:'броню'}
  };
  const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];
  const DIR_NAMES = ['север','восток','юг','запад'];
  const TILE=32, GRASS=0, ROAD=1, TREE=2, SHOP=3, CAVE=4, WALL=5, FLOOR=6, COUNTER=7, EXIT=8;
  const REGIONS=3;
  const C_HERO='#86efac', C_ENEMY='#fca5a5', C_NEUTRAL='#fde68a';

  const imgCache = new Map();
  function img(src){
    if(!src) return null;
    if(!imgCache.has(src)){ const im = new Image(); im.src = src; imgCache.set(src, im); }
    return imgCache.get(src);
  }
  HEROES.forEach(h => img(h.sprite)); MONSTERS.forEach(m => img(m.sprite));

  const storeKey = 'mm6_progress_v2';
  function loadProgress(){
    try{
      const p = JSON.parse(localStorage.getItem(storeKey) || '{}');
      return { map:Math.max(0,Number(p.map)||0), skirmish:Math.max(0,Number(p.skirmish)||0), achieved:!!p.achieved };
    }catch(e){ return {map:0,skirmish:0,achieved:false}; }
  }
  let progress = loadProgress();
  function saveProgress(){ try{ localStorage.setItem(storeKey, JSON.stringify(progress)); }catch(e){} }

  let phase='start', heroIdx=0, modeIdx=0, heroName='Герой', game=null, last=performance.now();
  let audioCtx=null;

  function beep(freq,dur){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='triangle'; o.frequency.value=freq;
      g.gain.setValueAtTime(.06,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
    }catch(e){}
  }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
  function key(x,y){ return x+','+y; }
  function good(id){ return GOODS.find(g=>g.id===id); }

  function updateProgressUI(){
    const mw=Math.min(5,progress.map), sw=Math.min(5,progress.skirmish), filled=Math.min(10,mw+sw);
    const c=2*Math.PI*17, ring=document.getElementById('ring');
    ring.style.strokeDasharray=String(c); ring.style.strokeDashoffset=String(c*(1-filled/10));
    document.getElementById('winCounts').textContent='Карта '+mw+'/5 · Схватка '+sw+'/5';
    if(progress.achieved){
      document.body.classList.add('achieved');
      document.getElementById('achTitle').textContent='ДОСТИЖЕНИЕ ПОЛУЧЕНО ✦';
      document.getElementById('achText').textContent='Круг славы закрыт: 5 побед в карте и 5 в схватке.';
    }else{
      document.body.classList.remove('achieved');
      document.getElementById('achTitle').textContent='ДОСТИЖЕНИЕ · КРУГ СЛАВЫ';
      document.getElementById('achText').textContent='5 побед в «Карте» и 5 побед в «Быстрой схватке»';
    }
  }

  function renderCards(){
    const hb=document.getElementById('heroCarousel'), mb=document.getElementById('modeCarousel');
    hb.innerHTML=''; mb.innerHTML='';
    HEROES.forEach((h,i)=>{
      const card=document.createElement('div');
      card.className='card'+(i===heroIdx?' sel':'');
      card.innerHTML='<div class="ring"></div><img src="'+h.sprite+'" alt=""><div class="cname">'+h.name+'</div>';
      if(i!==heroIdx) card.onclick=()=>{ heroIdx=i; renderCards(); };
      hb.appendChild(card);
    });
    MODES.forEach((m,i)=>{
      const card=document.createElement('div');
      card.className='card'+(i===modeIdx?' sel':'');
      card.innerHTML='<div class="ring"></div><div style="position:relative;font-size:40px;line-height:70px">'+m.icon+'</div><div class="cname">'+m.name+'</div>';

  /* ---------- общая отрисовка ---------- */
  function cloud(x,y,s,a){
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#dfe8ff'; ctx.beginPath();
    ctx.ellipse(x,y,34*s,10*s,0,0,6.29); ctx.ellipse(x-19*s,y+2*s,21*s,8*s,0,0,6.29); ctx.ellipse(x+17*s,y+3*s,23*s,8*s,0,0,6.29);
    ctx.fill(); ctx.restore();
  }
  function sky(now){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0e1738'); g.addColorStop(.45,'#334178'); g.addColorStop(.75,'#6c5a86'); g.addColorStop(1,'#252239');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,246,210,.85)'; ctx.beginPath(); ctx.arc(544,52,19,0,6.29); ctx.fill();
    for(let i=0;i<22;i++){ ctx.globalAlpha=.22+.4*Math.abs(Math.sin(now/700+i)); ctx.fillRect((i*83+31)%W,(i*47+13)%130,1.5,1.5); }
    ctx.globalAlpha=1;
    cloud(((now/32)%(W+220))-110,44,1.1,.20);
    cloud(((now/47+150)%(W+260))-130,86,.85,.16);
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function panel(x,y,w,h){ roundRect(x,y,w,h,7); ctx.fillStyle='rgba(6,8,18,.86)'; ctx.fill(); ctx.strokeStyle='rgba(251,191,36,.45)'; ctx.lineWidth=1.5; ctx.stroke(); }
  function bar(x,y,w,label,value,max,color){
    ctx.fillStyle='#f4e7c6'; ctx.font='bold 9px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(label,x,y+6);
    ctx.fillStyle='rgba(255,255,255,.10)'; roundRect(x+24,y+2,w-24,8,4); ctx.fill();
    const r=max>0?clamp(value/max,0,1):0;
    if(r>0){ ctx.fillStyle=color; roundRect(x+24,y+2,Math.max(3,(w-24)*r),8,4); ctx.fill(); }
    ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.fillText(Math.max(0,Math.round(value))+'/'+Math.max(0,Math.round(max)),x+w,y+6);
  }
  function drawSprite(src,x,y,size,scaleX,scaleY,bend,alpha){
    const im=img(src); ctx.save();
    ctx.globalAlpha=alpha==null?1:alpha;
    ctx.translate(x,y); ctx.rotate(bend||0); ctx.transform(scaleX==null?1:scaleX,0,0,scaleY==null?1:scaleY,0,0);
    if(im&&im.complete&&im.naturalWidth) ctx.drawImage(im,-size/2,-size,size,size);
    else{ ctx.fillStyle='#9fb2ff'; ctx.beginPath(); ctx.ellipse(0,-size*.55,size*.22,size*.38,0,0,6.29); ctx.fill(); }
    ctx.restore();
  }
  function drawHeroBack(x,y,size,now,lunge,bend){
    const h=HEROES[game.heroIdx];
    ctx.save(); ctx.globalAlpha=.38; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(x,y+4,size*.34,size*.08,0,0,6.29); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(x,y); ctx.rotate(bend||0); ctx.fillStyle='rgba(20,24,50,.65)';
    ctx.beginPath(); ctx.moveTo(-size*.24,-size*.78); ctx.quadraticCurveTo(0,-size*.92,size*.24,-size*.78);
    ctx.lineTo(size*.30,-size*.10); ctx.quadraticCurveTo(0,size*.02,-size*.30,-size*.10); ctx.closePath(); ctx.fill(); ctx.restore();

  function drawGround(horizon,base){
    const g=ctx.createLinearGradient(0,horizon,0,H);
    g.addColorStop(0,base[0]); g.addColorStop(1,base[1]); ctx.fillStyle=g; ctx.fillRect(0,horizon,W,H-horizon);
  }
  function drawRoad(horizon,topW,bottomW,c1,c2){
    ctx.save();
    const g=ctx.createLinearGradient(0,horizon,0,H); g.addColorStop(0,c1); g.addColorStop(1,c2);
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(W/2-topW/2,horizon); ctx.lineTo(W/2+topW/2,horizon);
    ctx.lineTo(W/2+bottomW/2,H); ctx.lineTo(W/2-bottomW/2,H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=2; ctx.setLineDash([14,16]);
    for(let y=horizon+18;y<H;y+=34){ const t=(y-horizon)/(H-horizon), w=topW+(bottomW-topW)*t;
      ctx.beginPath(); ctx.moveTo(W/2,y); ctx.lineTo(W/2,y+8); ctx.stroke(); }
    ctx.setLineDash([]); ctx.restore();
  }
  function drawGrassTufts(now,count){
    ctx.save(); ctx.strokeStyle='rgba(120,190,110,.5)'; ctx.lineWidth=1;
    for(let i=0;i<count;i++){
      const x=(i*97+Math.sin(now/900+i)*9)%W, y=196+((i*i*37)%158);
      for(let k=-1;k<=1;k++){ ctx.beginPath(); ctx.moveTo(x+k*3,y); ctx.lineTo(x+k*5,y-7-Math.abs(k)*2); ctx.stroke(); }
    }
    ctx.restore();
  }
  function drawTree(x,y,s){
    ctx.save(); ctx.fillStyle='#5b3b22'; ctx.fillRect(x-5*s,y-48*s,10*s,50*s);
    ctx.fillStyle='#175a34'; ctx.beginPath(); ctx.arc(x,y-64*s,30*s,0,6.29); ctx.fill();
    ctx.fillStyle='#2f8d4d'; ctx.beginPath(); ctx.arc(x-10*s,y-72*s,20*s,0,6.29); ctx.fill();
    ctx.fillStyle='#43a85e'; ctx.beginPath(); ctx.arc(x+11*s,y-67*s,17*s,0,6.29); ctx.fill(); ctx.restore();
  }
  function drawOrnamentWall(x,y,w,h,base,accent){
    ctx.save(); ctx.fillStyle=base; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle=accent; ctx.lineWidth=1; ctx.globalAlpha=.55;
    for(let yy=y+8;yy<y+h;yy+=14){ ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+w,yy); ctx.stroke(); }
    for(let xx=x+10;xx<x+w;xx+=22){ ctx.beginPath(); ctx.moveTo(xx,y); ctx.lineTo(xx,y+h); ctx.stroke(); }
    ctx.globalAlpha=.8; ctx.strokeStyle=accent;
    for(let xx=x+16;xx<x+w-8;xx+=44){ ctx.beginPath(); ctx.arc(xx,y+h-10,6,Math.PI,0); ctx.stroke(); }
    ctx.restore();
  }
  function drawBuilding(x,y,s,kind){
    const info=BUILDINGS[kind]||BUILDINGS.market, w=104*s, h=82*s;
    drawOrnamentWall(x-w/2,y-h,w,h,'#c9b89a',info.accent);
    ctx.fillStyle='#7e3f2e'; ctx.beginPath(); ctx.moveTo(x-w/2-8*s,y-h); ctx.lineTo(x,y-h-34*s); ctx.lineTo(x+w/2+8*s,y-h); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ffe6a0'; ctx.fillRect(x-30*s,y-h+18*s,20*s,18*s); ctx.fillRect(x+10*s,y-h+18*s,20*s,18*s);
    ctx.fillStyle='#241704'; ctx.fillRect(x-12*s,y-30*s,24*s,30*s);
    ctx.fillStyle=info.accent; ctx.font='bold '+Math.max(8,10*s)+'px sans-serif'; ctx.textAlign='center'; ctx.fillText(info.title,x,y-h-40*s);
  }
  function drawSmallRing(x,y,r){
    const filled=Math.min(10,Math.min(5,progress.map)+Math.min(5,progress.skirmish));
    ctx.save(); ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(x,y,r,0,6.29); ctx.stroke();
    ctx.strokeStyle=progress.achieved?'#7dffb2':'#fbbf24'; ctx.beginPath(); ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+6.29*filled/10); ctx.stroke(); ctx.restore();
  }
  function fitText(text,maxW,size,color,x,y){
    let s=size; ctx.font='bold '+s+'px sans-serif';
    while(ctx.measureText(text).width>maxW&&s>8){ s--; ctx.font='bold '+s+'px sans-serif'; }
    ctx.fillStyle=color; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(text,x,y);
  }

  /* ---------- КАРТА И РЕГИОНЫ ---------- */
  function makeMap(region){
    const g=[]; for(let y=0;y<10;y++){ g[y]=[]; for(let x=0;x<10;x++) g[y][x]=GRASS; }
    for(let x=0;x<10;x++){ g[5][x]=ROAD; if(region>0) g[2][x]=ROAD; }
    for(let y=0;y<10;y++) g[4+(region%2)][y]===undefined ? null : (g[y][4+(region%2)]=ROAD);
    for(let y=0;y<10;y++) g[y][4+(region%2)]=ROAD;
    const cave={x:8,y:8}, buildings=[{x:2,y:2,kind:'smith'},{x:7,y:2,kind:'alchemy'},{x:8,y:6,kind:'market'}];
    g[cave.y][cave.x]=CAVE;
    buildings.forEach(b=>{ g[b.y][b.x]=SHOP; game.buildings[key(b.x,b.y)]=b.kind; });
    const reserved=new Set([key(cave.x,cave.y),...buildings.map(b=>key(b.x,b.y)),'1,8']);
    for(let i=0;i<22;i++){ const x=rnd(0,9),y=rnd(0,9); if(g[y][x]===GRASS&&!reserved.has(key(x,y))) g[y][x]=TREE; }
    game.cave=cave;
    return g;
  }
  function makePickups(){
    game.pickups=[];
    const types=['coin','coin','mana','crystal','armor'];
    for(let i=0;i<7;i++){
      const type=types[rnd(0,types.length-1)];
      for(let tries=0;tries<20;tries++){
        const x=rnd(0,9), y=rnd(0,9);
        if(game.map[y][x]===TREE||game.map[y][x]===SHOP||game.map[y][x]===CAVE) continue;
        if(game.enemies.some(e=>e.alive&&e.x===x&&e.y===y)) continue;
        if(game.pickups.some(p=>p.x===x&&p.y===y)) continue;
        if(x===1&&y===8) continue;
        game.pickups.push({x,y,type,got:false}); break;
      }
    }
  }
  function startRegion(){
    game.interior=null; game.buildings={};
    game.map=makeMap(game.region); game.enemies=[];
    const spots=[[3,5],[6,5],[5,3],[5,7],[3,8],[8,2]];
    spots.forEach((s,i)=>{
      const m=MONSTERS[(i+rnd(0,3)+game.region)%MONSTERS.length];
      game.enemies.push({x:s[0],y:s[1],def:m,hp:m.hp,maxHp:m.hp,alive:true,gold:rnd(2,5)});
    });
    Object.assign(game.player,{x:1,y:8,px:1,py:1,fromX:1,fromY:1,moveT:0,jump:0,dir:0,face:1});
    makePickups();
    game.msg='Регион '+(game.region+1)+'/'+REGIONS+' · врагов: '+game.enemies.length+'. Победи всех!';
    toast('Регион '+(game.region+1)+'/'+REGIONS+' · вход в здание — Enter');
  }
  function nextRegion(){
    if(game.region>=REGIONS-1){ finishRun(true); return; }
    game.region++; game.battle=null; startRegion();
    game.hero.hp=Math.min(game.hero.maxHp,game.hero.hp+20);
    toast('Переход в регион '+(game.region+1)+' · +20 HP');
  }
  function enemyAt(x,y){ return game.enemies.find(e=>e.alive&&e.x===x&&e.y===y); }
  function pickupAt(x,y){ return game.pickups.find(p=>!p.got&&p.x===x&&p.y===y); }
  function addItem(id){
    const it=game.hero.inventory.find(i=>i.id===id);
    if(it) it.count++; else game.hero.inventory.push({id,count:1});
  }
  function collectPickup(p){
    p.got=true; const info=PICKUPS[p.type];
    if(p.type==='coin'){ const n=rnd(2,4); game.hero.gold+=n; game.msg='Находка: 🪙 '+n+'.'; }
    else if(p.type==='mana'){ const n=rnd(2,4); game.hero.mp=Math.min(game.hero.maxMp,game.hero.mp+n); game.msg='Находка: 💧 +'+n+' MP.'; }
    else if(p.type==='crystal'){ addItem('crystal'); game.msg='Находка: 🔷 кристалл.'; }
    else{ addItem(rnd(0,1)?'leather':'iron'); game.msg='Находка: 🛡 броня.'; }
    toast(game.msg); beep(720,.08);
  }
  function turnPlayer(d){
    if(!game||game.battle||game.shopOpen||game.mode!=='map') return;
    game.player.dir=(game.player.dir+d+4)%4; game.player.face=DIRS[game.player.dir][0]||1;
    game.msg='Поворот: '+DIR_NAMES[game.player.dir]+'.'; beep(330,.05);
  }
  function relativeMove(forward,side){
    if(!game||game.battle||game.shopOpen||game.mode!=='map') return;
    const f=DIRS[game.player.dir], r=DIRS[(game.player.dir+1)%4];
    tryMove(f[0]*forward+r[0]*side,f[1]*forward+r[1]*side);
  }
  function tryMove(dx,dy){
    if(phase!=='play'||!game||game.mode!=='map'||game.battle||game.shopOpen||game.player.moveT>0) return;
    const p=game.player, nx=clamp(Math.round(p.x)+dx,0,9), ny=clamp(Math.round(p.y)+dy,0,9);
    if(game.interior){
      const t=game.interior.grid[ny][nx];
      if(t===COUNTER){ toggleShop(true); return; }
      if(t===WALL){ game.msg='Стена.'; beep(120,.05); return; }
      if(t===EXIT){ exitBuilding(); return; }
      p.fromX=p.px; p.fromY=p.py; p.x=nx; p.y=ny; p.moveT=1; beep(280,.04);
      return;
    }
    const e=enemyAt(nx,ny);
    if(e){ startBattle('map',e); game.msg='⚠ Враг преградил путь: '+e.def.name+'. Пробел — атака · R — бегство.'; return; }
    const tile=game.map[ny][nx];
    if(tile===TREE){ game.msg='Дерево мешает пройти.'; beep(120,.05); return; }
    p.fromX=p.px; p.fromY=p.py; p.x=nx; p.y=ny; p.moveT=1; p.jump=0; beep(280,.04);
    if(tile===SHOP){ enterBuilding(nx,ny); return; }
    if(tile===CAVE){ game.msg='Пещера ведёт в следующий регион. Очистите текущий!'; }
    const pk=pickupAt(nx,ny); if(pk) collectPickup(pk);
  }
  function tryInteract(){
    if(!game||game.battle||game.shopOpen||game.mode!=='map') return;
    const p=game.player, d=DIRS[p.dir], nx=Math.round(p.x)+d[0], ny=Math.round(p.y)+d[1];
    if(game.interior){
      if(game.interior.grid[ny]&&game.interior.grid[ny][nx]===EXIT){ exitBuilding(); return; }
      if(game.shopOpen){ toggleShop(false); return; }
      toggleShop(true); return;
    }else if(nx>=0&&ny>=0&&nx<10&&ny<10&&game.map[ny][nx]===SHOP){ enterBuilding(nx,ny); }
    else game.msg='Здесь не с чем взаимодействовать.';
  }
  function enterBuilding(x,y){
    const kind=game.buildings[key(x,y)]||'market';
    const grid=[
      [WALL,WALL,WALL,WALL,WALL,WALL,WALL],
      [WALL,FLOOR,FLOOR,COUNTER,FLOOR,FLOOR,WALL],
      [WALL,FLOOR,FLOOR,FLOOR,FLOOR,FLOOR,WALL],
      [WALL,FLOOR,FLOOR,FLOOR,FLOOR,FLOOR,WALL],
      [WALL,FLOOR,FLOOR,FLOOR,FLOOR,FLOOR,WALL],
      [WALL,EXIT,FLOOR,FLOOR,FLOOR,FLOOR,WALL],
      [WALL,WALL,WALL,WALL,WALL,WALL,WALL]
    ];
    game.interior={kind,grid,returnTo:{x,y},counter:{x:3,y:1},exit:{x:1,y:5}};
    Object.assign(game.player,{x:2,y:4,px:2,py:4,fromX:2,fromY:4,moveT:0,dir:0,face:1});
    game.msg='Вы вошли: '+(BUILDINGS[kind]||BUILDINGS.market).title+'. Кнопка «Лавка» или Enter — открыть магазин.';
    toast(game.msg); beep(520,.1); updatePads();
  }
  function exitBuilding(){
    const back=game.interior.returnTo;
    game.interior=null;
    Object.assign(game.player,{x:back.x,y:back.y,px:back.x,py:back.y,fromX:back.x,fromY:back.y,moveT:0});
    game.msg='Вы вышли на карту.'; toast(game.msg); beep(360,.08); updatePads();
  }
  function drawMiniMap(){
    const x=W-166,y=14,s=15;
    panel(x-6,y-6,158,158);
    const colors=['#2f5b38','#8a7a56','#1f6b3a','#d6b06a','#4b4a5c'];
    for(let yy=0;yy<10;yy++) for(let xx=0;xx<10;xx++){
      ctx.fillStyle=colors[game.map[yy][xx]]||'#2f5b38'; ctx.fillRect(x+xx*s,y+yy*s,s-1,s-1);
    }
    game.pickups.forEach(p=>{ if(p.got)return; ctx.fillStyle=PICKUPS[p.type].color; ctx.fillRect(x+p.x*s+5,y+p.y*s+5,5,5); });
    game.enemies.forEach(e=>{ if(!e.alive)return; ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(x+e.x*s+s/2,y+e.y*s+s/2,4,0,6.29); ctx.fill(); });
    ctx.save(); ctx.translate(x+Math.round(game.player.px)*s+s/2,y+Math.round(game.player.py)*s+s/2); ctx.rotate(game.player.dir*Math.PI/2);
    ctx.fillStyle='#ffe9a8'; ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(5,5); ctx.lineTo(-5,5); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.fillStyle='#ffe6a8'; ctx.font='bold 10px sans-serif'; ctx.textAlign='left'; ctx.fillText('КАРТА '+(game.region+1)+'/'+REGIONS,x,y+160);
  }
  function drawMap(now){
    sky(now); drawGround(176,['#3a5b42','#1a2a20']); drawRoad(176,18,540,'#6d6244','#3d3829'); drawGrassTufts(now,44);
    const p=game.player, f=DIRS[p.dir], r=DIRS[(p.dir+1)%4], px=p.px, py=p.py;
    for(let d=4;d>=1;d--){
      for(let off=-2;off<=2;off++){
        const tx=Math.round(px)+f[0]*d+r[0]*off, ty=Math.round(py)+f[1]*d+r[1]*off;
        if(tx<0||ty<0||tx>9||ty>9) continue;
        const t=game.map[ty][tx], sc=1-d*.16, sx=W/2+off*(74-d*10), sy=206+(4-d)*13;
        if(t===ROAD){ ctx.fillStyle='rgba(150,136,92,.75)'; ctx.fillRect(sx-20*sc,sy-8*sc,40*sc,26*sc); }
        if(t===CAVE){
          ctx.fillStyle='#161824'; ctx.beginPath(); ctx.ellipse(sx,sy,58*sc,48*sc,0,Math.PI,0); ctx.fill(); ctx.fillRect(sx-58*sc,sy,116*sc,62*sc);
          ctx.fillStyle='#05060b'; ctx.beginPath(); ctx.ellipse(sx,sy+22*sc,28*sc,32*sc,0,Math.PI,0); ctx.fill(); ctx.fillRect(sx-28*sc,sy+22*sc,56*sc,30*sc);
        }
        if(t===SHOP) drawBuilding(sx,sy,sc,game.buildings[key(tx,ty)]||'market');
        if(t===TREE) drawTree(sx,sy,sc);
      }
    }
    game.pickups.forEach(pk=>{
      if(pk.got)return;
      const dx=pk.x-px,dy=pk.y-py, forward=dx*f[0]+dy*f[1], side=dx*r[0]+dy*r[1];
      if(forward<0||forward>5||Math.abs(side)>2)return;
      const sc=1-forward*.13, x=W/2+side*(72-forward*10), y=272-forward*16;

  function startBattle(source,enemy){
    const h=HEROES[game.heroIdx];
    const m=(enemy&&enemy.def&&typeof enemy.def==='object')?enemy.def:enemy;
    game.battle={
      source, enemy:enemy, monster:{name:m.name,sprite:m.sprite,atk:m.atk,def:m.def,hp:(enemy&&enemy.hp)||m.hp,maxHp:(enemy&&enemy.maxHp)||m.hp,poison:m.poison},
      turn:'hero', busy:false, end:null, anim:null, log:[], logColor:[], char:0,
      theme:source==='skirmish'?game.theme:rnd(0,2)
    };
    if(source==='skirmish'){ game.hero.hp=h.hp; game.hero.mp=h.mp; }
    game.msg='Враг: '+m.name+'. Пробел — атака · R — бегство.';
    pushLog(m.name+' встаёт перед вами.', C_ENEMY);
    updatePads();
  }
  function pushLog(text,color){
    if(!game||!game.battle)return;
    const b=game.battle;
    b.log.push(text); b.logColor.push(color||C_NEUTRAL);
    if(b.log.length>5){ b.log.shift(); b.logColor.shift(); }
    b.char=b.log[b.log.length-1].length;
  }
  function heroAttack(special){
    const b=game&&game.battle; if(!b||b.busy||b.end||b.turn!=='hero')return;
    if(special&&game.hero.mp<3){ toast('Не хватает маны'); return; }
    b.busy=true;
    const atk=game.hero.weapons[game.hero.weaponLevel].dmg+(special?8:0);
    const dmg=Math.max(1,atk-b.monster.def)+rnd(0,2);
    if(special)game.hero.mp=Math.max(0,game.hero.mp-3);
    b.monster.hp=Math.max(0,b.monster.hp-dmg); if(b.enemy&&b.enemy.hp!=null)b.enemy.hp=b.monster.hp;
    b.anim={who:'hero',t:1,jump:special?24:10};
    pushLog((special?'ЗАРЯД! ':'Удар! ')+'Атака '+atk+' − Защита '+b.monster.def+' = '+dmg+' урона.', C_HERO);
    beep(special?880:440,special?.15:.08);
    setTimeout(()=>{
      if(!game||game.battle!==b||b.end)return;
      if(b.monster.hp<=0){ finishBattle(true); return; }
      b.turn='enemy'; b.busy=false; setTimeout(()=>enemyTurn(b),420);
    },620);
  }
  function enemyTurn(b){
    if(!game||game.battle!==b||b.turn!=='enemy'||b.busy||b.end)return;
    b.busy=true;
    const dmg=Math.max(0,b.monster.atk-game.hero.armor)+rnd(0,1);
    game.hero.hp=Math.max(0,game.hero.hp-dmg); b.anim={who:'enemy',t:1,jump:8};
    pushLog(b.monster.name+': атака '+b.monster.atk+' − броня '+game.hero.armor+' = '+dmg+' урона.', C_ENEMY);
    if(b.monster.poison){ game.hero.poison=3; game.hero.poisonTurns=2; pushLog(b.monster.name+' наложил яд 3 ед на 2 хода.', C_ENEMY); }
    beep(180,.12);
    setTimeout(()=>{
      if(!game||game.battle!==b||b.end)return;
      if(game.hero.poison>0){
        const pd=Math.min(game.hero.poison,game.hero.hp); game.hero.poison=Math.max(0,game.hero.poison-1);
        game.hero.hp-=pd; pushLog('Яд снимает '+pd+' HP.', C_ENEMY);
        game.hero.poisonTurns=Math.max(0,(game.hero.poisonTurns||0)-1);
        if(!game.hero.poisonTurns) game.hero.poison=0;
      }
      if(game.hero.hp<=0){ finishBattle(false); return; }
      b.turn='hero'; b.busy=false;
    },700);
  }
  function finishBattle(win){
    const b=game&&game.battle; if(!b||b.end)return;
    b.end=win?'win':'lose'; pushLog(win?'ПОБЕДА!':'Поражение.',win?C_HERO:C_ENEMY);
    beep(win?980:120,.28); updatePads();
    setTimeout(()=>{
      if(win){
        game.hero.gold+=b.enemy&&b.enemy.gold?b.enemy.gold:rnd(2,5);
        if(b.enemy&&b.enemy.alive!==undefined) b.enemy.alive=false;
        if(rnd(0,3)===0){ addItem(rnd(0,2)?'crystal':'coin'); toast('С врага: ценная находка!'); }
        if(b.source==='skirmish') progress.skirmish=Math.min(5,progress.skirmish+1);
        else if(game.enemies.some(e=>e.alive)){
          const left=game.enemies.filter(e=>e.alive).length;
          game.battle=null; game.msg='Враг повержен! Осталось врагов: '+left+'.';
          toast('Победа! Осталось врагов: '+left); saveProgress(); updatePads(); return;
        }
        saveProgress();
      }else toast('Поражение — круг не обновлён');
      if(win&&b.source==='map'){ nextRegion(); return; }
      phase='start'; game=null; startScreen.classList.remove('hidden'); updatePads(); renderCards();
    },1700);
  }
  function fleeBattle(){
    const b=game&&game.battle;
    if(!b||b.busy||b.end)return;
    b.busy=true;
    beep(320,.08);

  function loop(now){
    requestAnimationFrame(loop);
    const dt=Math.min(50,now-last); last=now;
    if(phase!=='play'||!game)return;
    if(game.battle) drawBattle(now,dt);
    else if(game.mode==='map'){
      const p=game.player;
      if(p.moveT>0){
        p.moveT=Math.max(0,p.moveT-dt/230); const t=ease(1-p.moveT);
        p.px=lerp(p.fromX,p.x,t); p.py=lerp(p.fromY,p.y,t); p.jump=Math.sin(Math.PI*t)*16;
      }
      if(game.interior) drawInterior(now); else drawMap(now);
    }else drawBattle(now,dt);
  }

  document.addEventListener('keydown',e=>{
    if(phase==='start'){
      const typing=e.target&&e.target.id==='heroName';
      if(typing&&e.key!=='Enter')return;
      if(e.key==='ArrowLeft'){e.preventDefault();selectHero(-1);}
      else if(e.key==='ArrowRight'){e.preventDefault();selectHero(1);}
      else if(e.key==='ArrowUp'){e.preventDefault();selectMode(-1);}
      else if(e.key==='ArrowDown'){e.preventDefault();selectMode(1);}
      else if(e.key==='Enter'){e.preventDefault();startGame();}
      return;
    }
    const k=e.key.toLowerCase();
    if(k==='m'||k==='ь'||e.key==='Escape'){ e.preventDefault(); if(game&&game.shopOpen)toggleShop(false); else goHub(); return; }
    if((k==='b'||k==='б')&&!game.battle){ e.preventDefault(); toggleShop(!game.shopOpen); return; }
    if(game&&game.shopOpen)return;
    if(game&&game.battle){
      if(!game.battle.end&&(e.key===' '||e.key==='Enter')){e.preventDefault();heroAttack(false);}
      else if(!game.battle.end&&(k==='f'||k==='а')){e.preventDefault();heroAttack(true);}
      else if(!game.battle.end&&(k==='r'||k==='к')){e.preventDefault();fleeBattle();}
      return;
    }
    if(game&&game.mode==='map'){
      if(k==='q'||k==='й'){ e.preventDefault(); turnPlayer(-1); return; }
      if(k==='e'||k==='у'){ e.preventDefault(); turnPlayer(1); return; }
      if(e.key==='Enter'){ e.preventDefault(); tryInteract(); return; }
      const rel = ({ArrowUp:[1,0],w:[1,0],ц:[1,0],ArrowDown:[-1,0],s:[-1,0],ы:[-1,0],ArrowLeft:[0,-1],a:[0,-1],ф:[0,-1],ArrowRight:[0,1],d:[0,1],в:[0,1]})[e.key]||
                  ({ArrowUp:[1,0],w:[1,0],ц:[1,0],ArrowDown:[-1,0],s:[-1,0],ы:[-1,0],ArrowLeft:[0,-1],a:[0,-1],ф:[0,-1],ArrowRight:[0,1],d:[0,1],в:[0,1]})[k];
      if(rel){ e.preventDefault(); relativeMove(rel[0],rel[1]); }
    }
  });
  cv.addEventListener('pointerdown',()=>{ if(game&&game.battle)heroAttack(false); });

  function finishRun(win){
    if(!game)return;
    if(win){
      progress.map=Math.min(5,progress.map+1);
      if(progress.map>=5&&progress.skirmish>=5&&!progress.achieved){ progress.achieved=true; toast('ДОСТИЖЕНИЕ: Круг славы закрыт!'); }
      else toast('Все регионы очищены! Карта '+progress.map+'/5');
      saveProgress();
    }
    phase='start'; game=null; startScreen.classList.remove('hidden'); updatePads(); renderCards();
  }

  function applyD28Data(d){
    if(!d||!d.heroes||!d.monsters||!d.weapons)return;
    const desc={}; HEROES.forEach(h=>desc[h.name]=h.desc);
    HEROES.splice(0,HEROES.length,...d.heroes.slice(0,2).map(h=>({
      name:h.name, set:h.set, hp:h.maxHp, mp:h.maxMp, atk:1, def:0, sprite:h.sprite,
      desc:desc[h.name]||'Герой из Подземелья 28.',
      weapons:d.weapons[h.set].map(w=>({...w,sell:Math.max(1,Math.floor((w.cost||0)*.75))}))
    })));
    MONSTERS.splice(0,MONSTERS.length,...d.monsters.map(m=>({
      name:m.name, hp:m.hp, atk:m.atk, def:m.def, sprite:m.sprite, poison:m.poison
    })));
    heroIdx=Math.min(heroIdx,HEROES.length-1);
    imgCache.clear();
    HEROES.forEach(h=>{ img(h.sprite); h.weapons.forEach(w=>img(w.sprite)); }); MONSTERS.forEach(m=>img(m.sprite));
    renderCards();
  }
  window.addEventListener('d28-data',e=>applyD28Data(e.detail));

  window.__mm6State = function(){ return game; };
  renderCards();
})();
</script>
<script type="module">
import { D28_DATA } from '../dungeon28/shared-data.js';
window.dispatchEvent(new CustomEvent('d28-data', { detail: D28_DATA }));
</script>
