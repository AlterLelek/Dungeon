<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>Подземелье</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ЭКРАН ЛОГИНА -->
    <div id="login-screen">
      <h1>ПОДЗЕМЕЛЬЕ <span id="ver-login"></span></h1>
      <input type="text" id="guest-name" placeholder="Имя героя">
      <button id="btn-random-name" class="btn-secondary">🎲 Случайное имя</button>
      <button id="btn-guest" class="btn-primary">Играть гостем</button>
      <button id="btn-google" class="btn-secondary" style="opacity:0.5; cursor:not-allowed;">Войти через Google</button>
      <div id="error-msg" style="color: #ef4444; margin-top: 10px;"></div>
    </div>

    <!-- ЭКРАН ИГРЫ -->
    <div id="game-screen" style="display: none;">
      <div id="hud">
        <div class="hud-hero">
          <div class="hero-fig" id="hero-fig">⚔️</div>
          <div class="hero-stats">
            <div class="hs-title" id="hero-name-label">ГЕРОЙ</div>
            <div>❤️ <span id="hp">100</span></div>
            <div>🛡️ <span id="shd-hud">0</span></div>
            <div>💪 <span id="bonus">1</span></div>
            <div id="hero-weapon">⚔️ Кулаки</div>
          </div>
        </div>
        <div class="hud-center">
          <div>🏰 <span id="floor-hud">1</span></div>
          <div>👣 <span id="turns">0</span></div>
          <div id="high-score-line"></div>
          <div><span class="coin-ico"></span> <span id="score">0</span></div>
          <div>⚡ <span id="energy">0</span></div>
        </div>
        <div class="hud-enemies">
          <div class="he-title">ВРАГИ (<span id="e-count">0</span>)</div>
          <div id="e-list"></div>
        </div>
      </div>

      <div id="btn-row">
        <button id="shop-btn" class="btn-primary">🛒 Лавка [M]</button>
        <button id="records-btn" class="btn-primary">🏆 Рекорды</button>
        <button id="settings-btn" class="btn-primary">⚙️ Настройки</button>
      </div>

      <div class="magic-row">
        <button id="btn-light" class="m-btn" style="background-color:#eab308;">⚡ Молния<br><span>3 MP | x0</span></button>
        <button id="btn-heal" class="m-btn" style="background-color:#22c55e;">💚 Лечение<br><span>3 MP | x0</span></button>
        <button id="btn-stun" class="m-btn" style="background-color:#38bdf8;">❄️ Стан<br><span>2 MP | x0</span></button>
        <button id="btn-hurricane" class="m-btn" style="background-color:#a855f7;">🌪️ Ураган<br><span>4 MP | x0</span></button>
      </div>

      <!-- Сюда main.js вставит canvas -->
      
      <div class="dpad" style="margin-top: 10px;">
        <button class="btn wide-row" onclick="movePlayer(0,-32)">▲ W</button>
        <button class="btn" onclick="movePlayer(-32,0)">◀ A</button>
        <button class="btn" style="background-color:#e11d48;" onclick="skipTurn()">● Пропуск</button>
        <button class="btn" onclick="movePlayer(32,0)">▶ D</button>
        <button class="btn wide-row" onclick="movePlayer(0,32)">▼ S</button>
      </div>
      <div style="text-align:center; color:#9ca3af; font-size:12px; margin-top:10px;">Версия: <span id="ver-game"></span></div>
    </div>
  </div>

  <!-- ПАНЕЛИ -->
  <div id="shop-panel" class="panel" style="display:none;">
    <h3>🛒 Лавка</h3>
    <div id="shop-gold">В кармане: 0 золота</div>
    <div class="panel-row">
      <span id="shop-wpn-label"></span>
      <span id="shop-wpn-cost"></span>
      <button id="shop-wpn-btn" class="buy-btn">Купить</button>
    </div>
    <div class="panel-row">
      <span>🛡️ Броня +1</span>
      <span id="shop-shd-cost"></span>
      <button id="shop-shd-btn" class="buy-btn">Купить</button>
    </div>
    <button id="close-shop" class="close-panel">Закрыть</button>
  </div>

  <div id="records-panel" class="panel" style="display:none;">
    <h3>🏆 Рекорды</h3>
    <div>Лучший результат: <span id="rec-highscore">0</span> ходов</div>
    <div>Имя: <span id="rec-best-name">Никто</span></div>
    <div>Убито монстров: <span id="rec-kills">0</span></div>
    <div>Собрано золота: <span id="rec-gold">0</span></div>
    <button id="close-records" class="close-panel">Закрыть</button>
  </div>

  <div id="settings-panel" class="panel" style="display:none;">
    <h3>⚙️ Настройки</h3>
    <div class="panel-row">
      <span>Звук</span>
      <input type="range" id="set-vol-master" min="0" max="100" value="100">
    </div>
    <div class="panel-row">
      <span>Музыка</span>
      <input type="range" id="set-vol-music" min="0" max="100" value="50">
    </div>
    <div class="panel-row">
      <span>Фон</span>
      <input type="range" id="set-vol-ambient" min="0" max="100" value="50">
    </div>
    <div class="panel-row">
      <span>Эффекты</span>
      <input type="range" id="set-vol-sfx" min="0" max="100" value="100">
    </div>
    <div class="panel-row">
      <span>Монстров +</span>
      <input type="range" id="set-monster-add" min="0" max="5" value="0">
    </div>
    <div class="panel-row">
      <span>Бонус раз в N</span>
      <input type="range" id="set-item-rate" min="1" max="5" value="3">
    </div>
    <button id="close-settings" class="close-panel">Закрыть</button>
  </div>

  <!-- ПОДКЛЮЧЕНИЕ ВСЕХ СКРИПТОВ (ПЛОСКАЯ СТРУКТУРА) -->
  <script type="module" src="main.js"></script>
</body>
</html>
