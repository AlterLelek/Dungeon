<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <link rel="icon" href="data:,">
    <title>Подземелье 28</title>
    <style>
        body { background-color: #1e1e24; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: #fff; overflow: hidden; }
        #login-screen { display: flex; flex-direction: column; align-items: center; gap: 20px; background: #2b2b3b; padding: 40px 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #4f46e5; width: 300px; }
        h1 { margin: 0; font-size: 32px; text-transform: uppercase; letter-spacing: 4px; color: #fbbf24; text-shadow: 0 0 15px rgba(251,191,36,0.5); text-align: center; }
        .input-group { display: flex; flex-direction: column; width: 100%; gap: 10px; }
        input[type="text"] { padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid #4b5563; background: #374151; color: #fff; outline: none; text-align: center; }
        input[type="text"]:focus { border-color: #fbbf24; }
        button { padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; width: 100%; font-family: inherit; }
        .btn-google { background: #4285f4; color: white; }
        .btn-google:hover { background: #3367d6; }
        .btn-guest { background: #10b981; color: white; }
        .btn-guest:hover { background: #059669; }
        .divider { display: flex; align-items: center; width: 100%; color: #6b7280; font-size: 14px; }
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #4b5563; margin: 0 10px; }
        #error-msg { color: #ef4444; font-size: 14px; text-align: center; height: 20px; }

        #game-screen { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; height: 100%; justify-content: center; }
        #hud { display: flex; justify-content: space-between; width: 326px; color: #fff; font-weight: bold; font-size: 16px; padding: 5px 10px; box-sizing: border-box; background: rgba(0,0,0,0.3); border-radius: 8px; border: 2px solid #4b5563; }
        #hud span { color: #fbbf24; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Подземелье 28</h1>
        <div class="input-group">
            <input type="text" id="guest-name" placeholder="Введите имя героя" maxlength="16">
            <button class="btn-guest" id="btn-guest">Играть без аккаунта</button>
        </div>
        <div class="divider">ИЛИ</div>
        <button class="btn-google" id="btn-google">Войти через Google</button>
        <div id="error-msg"></div>
    </div>

    <div id="game-screen">
        <div id="hud">
            <div>❤️ <span id="hud-hp">100</span></div>
            <div>🪙 <span id="hud-gold">0</span></div>
            <div>⚔️ <span id="hud-floor">1</span></div>
        </div>
        <!-- Сюда скрипт вставит canvas -->
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
