<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой хаб</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px 0;
            box-sizing: border-box;
            overflow-y: auto;
            user-select: none;
        }
        h1 {
            color: #fbbf24;
            text-shadow: 0 0 15px rgba(251,191,36,0.5);
            letter-spacing: 2px;
            font-size: 32px;
            margin: 0 0 14px;
        }
        #entry-anchor { display: contents; }
        #entry-anchor + .dentry { margin-bottom: 8px; }
        .profile-note {
            color: #9fb0d8;
            font-size: 12px;
            text-align: center;
            margin: 0 0 12px;
            min-height: 16px;
        }
        .profile-note.filled { color: #fde68a; font-style: italic; }
        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 40px;
            margin: 10px;
            background: linear-gradient(135deg, #2b2b3b, #1a1a24);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s, border-color 0.2s;
            border: 2px solid #4f46e5;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .game-card:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #fbbf24;
            box-shadow: 0 15px 30px rgba(251,191,36,0.3), 0 0 20px rgba(251,191,36,0.2);
        }
        .game-card:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            border-color: #fbbf24;
        }
        .game-card span {
            font-size: 40px;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }
        .game-card:active span { transform: scale(0.9); }
        @media (max-width: 520px) {
            h1 { font-size: 24px; }
            .game-card { padding: 14px 26px; font-size: 18px; }
            .game-card span { font-size: 32px; }
        }
    </style>
</head>
<body>
    <h1>🎮 Игровой хаб</h1>
    <!-- Общая форма входа: ник, аватар и комментарий. -->
    <div id="entry-anchor"><input id="hub-nick" type="hidden"></div>
    <p class="profile-note" id="hub-comment"></p>
    <a href="games/dungeon28/index.html" class="game-card">
        <span>🏰</span>
        Подземелье 28
    </a>
    <a href="games/labyrinth/index.html" class="game-card">
        <span>🌀</span>
        Лабиринт
    </a>
    <a href="games/sf2_battles/index.html" class="game-card">
        <span>⚔️</span>
        SF2 Битвы
    </a>
    <a href="games/mm6/index.html" class="game-card">
        <span>👁️</span>
        РПГ MM6
    </a>

<script type="module">
import { mountEntryForm, getProfile, saveProfile, profileComment, profileNick, profileAvatar } from './games/shared/entry-profile.js';

mountEntryForm({ input:'#hub-nick', title:'Вход в игру' });

const note = document.getElementById('hub-comment');
function paintNote(){
  const c = profileComment();
  note.textContent = c ? '💬 ' + profileAvatar() + ' ' + profileNick() + ': «' + c + '»' : '';
  note.classList.toggle('filled', !!c);
}
paintNote();
document.addEventListener('dungeon-profile', paintNote);

window.__hubProfile = { get:getProfile, save:saveProfile };
</script>
</body>
</html>
