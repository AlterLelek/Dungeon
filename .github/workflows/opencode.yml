name: OpenCode Agent

on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenCode
        uses: sst/opencode/github@latest
        with:
          model: anthropic/claude-sonnet-4-6
          prompt: |
            Ты — опытный разработчик на JavaScript/TypeScript.
            Твоя задача — реализовать функционал из Issue.
            У тебя есть доступ к папке assets (там все спрайты) и games/mm6/index.html (структура UI).
            Если нужно, создай новые файлы или измени существующие.
            В конце дай команду для создания Pull Request.