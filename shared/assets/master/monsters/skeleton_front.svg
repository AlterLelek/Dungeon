<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bone { fill:#F5F5DC; stroke:#222; stroke-width:1.5; stroke-linejoin:round; }
      .eye { fill:#DC143C; }
      .shadow { fill:#333; opacity:0.2; }
    </style>
  </defs>

  <!-- Фон -->
  <rect x="0" y="0" width="256" height="256" fill="#F0F0F0" />

  <!-- Череп -->
  <g id="head">
    <path class="bone" d="M110 55 L146 55 L152 75 L142 95 L114 95 L104 75 Z"/>
    <circle cx="124" cy="80" r="4" class="eye"/>
    <circle cx="132" cy="80" r="4" class="eye"/>
  </g>

  <!-- Грудная клетка и ребра -->
  <g id="torso">
    <path class="bone" d="M100 95 L156 95 L162 125 L142 155 L114 155 L100 125 Z"/>
    <!-- Ребра (декоративные линии) -->
    <path d="M110 110 Q120 120 130 110" stroke="#222" stroke-width="1" fill="none"/>
    <path d="M120 120 Q130 130 140 120" stroke="#222" stroke-width="1" fill="none"/>
  </g>

  <!-- Таз и ноги -->
  <g id="legs">
    <path class="bone" d="M100 155 L80 185 L100 215 L128 195 L156 215 L176 185 L156 155 Z"/>
    <path class="bone" d="M80 185 L70 205 L80 225 L90 205 Z"/>
    <path class="bone" d="M176 185 L186 205 L176 225 L166 205 Z"/>
  </g>

  <!-- Левая рука (пустая, для симметрии) -->
  <g id="left-arm">
    <path class="bone" d="M100 125 L85 150 L100 175 L115 150 Z"/>
  </g>

  <!-- Правая рука и оружие (АНИМАЦИЯ ЗДЕСЬ) -->
  <!-- transform-origin настроен на плечо (176, 125) -->
  <g id="arm" style="transform-origin: 176px 125px;">
    <path class="bone" d="M176 125 L190 150 L176 175 L162 150 Z"/>
    
    <g id="weapon">
      <!-- Кость-клинок -->
      <path class="bone" d="M190 150 L200 130 L210 150 L200 170 Z"/>
      <!-- Рукоять из кости -->
      <path class="bone" d="M190 150 L198 165 L190 180 L182 165 Z"/>
    </g>
  </g>
</svg>
